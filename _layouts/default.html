<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">NGA</span>
        <span class="brand-text">
          <strong>Aarhus 2026</strong>
          <span>Class notes</span>
        </span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '/program/' | relative_url }}" {% if page.url contains '/program' or page.url contains '/sessions' %}aria-current="page"{% endif %}>Program</a>
        <a href="{{ '/curriculum/' | relative_url }}" {% if page.url contains '/curriculum' or page.url contains '/places' %}aria-current="page"{% endif %}>Curriculum</a>
        <a href="{{ '/sources/' | relative_url }}" {% if page.url contains '/sources' %}aria-current="page"{% endif %}>Sources</a>
        <a href="{{ '/practical/' | relative_url }}" {% if page.url contains '/practical' %}aria-current="page"{% endif %}>Practical</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Student notes for Nordic Guide Academy · Aarhus 2026. Not an official NGA site.</p>
      <p class="muted">Handout source: Charlotte and the teacher team, September 2026.</p>
    </div>
  </footer>
</body>
</html>
